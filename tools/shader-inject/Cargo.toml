[package]
name = "shader-inject"
version = "0.1.0"
edition = "2021"
description = "LD_PRELOAD library that intercepts glXSwapBuffers to apply RetroArch .slangp shaders"

[lib]
crate-type = ["cdylib"]

[dependencies]
librashader.workspace = true
glow.workspace = true
x11.workspace = true
log.workspace = true
env_logger.workspace = true
