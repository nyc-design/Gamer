[package]
name = "screen-tool"
version = "0.1.0"
edition = "2021"
description = "Secondary screen tool: zoom/crop viewer and FPS monitor for the bottom display"

[dependencies]
glow = "0.16"
x11 = { version = "2.21", features = ["xlib", "glx", "keysym"] }
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1"
signal-hook = "0.3"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
strip = true
