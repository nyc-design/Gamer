[workspace]
members = ["shader-overlay", "shader-inject", "screen-tool"]
resolver = "2"

[workspace.dependencies]
glow = "0.16"
x11 = { version = "2.21", features = ["xlib", "glx"] }
x11rb = { version = "0.13", features = ["composite", "xfixes", "damage", "randr"] }
librashader = { version = "0.10", features = ["runtime-gl", "stable"] }
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1"
signal-hook = "0.3"

[profile.release]
opt-level = 3
lto = true
strip = true
